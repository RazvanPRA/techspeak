# Local PostgreSQL for the TechSpeak backend: `docker compose up -d`
name: techspeak

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techspeak
      POSTGRES_PASSWORD: techspeak
      POSTGRES_DB: techspeak
    ports:
      - '5432:5432'
    volumes:
      - techspeak-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techspeak']
      interval: 5s
      retries: 10

volumes:
  techspeak-db:
